<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Flowise RAG 시연 화면 흐름</title>
  <desc id="desc">Flowise에서 입력, 문서 저장소, 검색기, 프롬프트, LLM 노드를 연결하는 데모 화면</desc>
  <rect width="1280" height="720" fill="#f8fbfd"/>
  <rect x="70" y="58" width="1140" height="604" rx="22" fill="#ffffff" stroke="#d6dee6" stroke-width="2"/>
  <text x="640" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Flowise 데모: RAG 흐름을 노드로 보여주기</text>
  <text x="640" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#687586">DocuMeta 입력이 검색과 생성 노드로 어떻게 흘러가는지 시각화한다</text>

  <g font-family="Arial, sans-serif">
    <rect x="108" y="300" width="174" height="92" rx="16" fill="#ffffff" stroke="#d6dee6" stroke-width="2"/>
    <text x="195" y="336" text-anchor="middle" font-size="18" font-weight="700" fill="#17324d">Chat Input</text>
    <text x="195" y="366" text-anchor="middle" font-size="14" fill="#687586">DocuMeta JSON</text>

    <rect x="344" y="214" width="190" height="92" rx="16" fill="#f5f8fb" stroke="#d6dee6" stroke-width="2"/>
    <text x="439" y="250" text-anchor="middle" font-size="18" font-weight="700" fill="#17324d">Document Store</text>
    <text x="439" y="280" text-anchor="middle" font-size="14" fill="#687586">선례·지침 업로드</text>

    <rect x="344" y="392" width="190" height="92" rx="16" fill="#ffffff" stroke="#d6dee6" stroke-width="2"/>
    <text x="439" y="428" text-anchor="middle" font-size="18" font-weight="700" fill="#17324d">Retriever</text>
    <text x="439" y="458" text-anchor="middle" font-size="14" fill="#687586">관련 근거 검색</text>

    <rect x="608" y="300" width="190" height="92" rx="16" fill="#ffffff" stroke="#d6dee6" stroke-width="2"/>
    <text x="703" y="336" text-anchor="middle" font-size="18" font-weight="700" fill="#17324d">Prompt Template</text>
    <text x="703" y="366" text-anchor="middle" font-size="14" fill="#687586">슬롯·검토 기준 반영</text>

    <rect x="872" y="300" width="174" height="92" rx="16" fill="#ffffff" stroke="#d6dee6" stroke-width="2"/>
    <text x="959" y="336" text-anchor="middle" font-size="18" font-weight="700" fill="#17324d">Chat Model</text>
    <text x="959" y="366" text-anchor="middle" font-size="14" fill="#687586">LLM 호출</text>

    <rect x="828" y="468" width="262" height="76" rx="16" fill="#f7f0e3" stroke="#eadfc9" stroke-width="2"/>
    <text x="959" y="501" text-anchor="middle" font-size="17" font-weight="700" fill="#17324d">출력 전 확인</text>
    <text x="959" y="528" text-anchor="middle" font-size="14" fill="#594832">빠진 슬롯과 근거 불일치를 먼저 묻는다</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#176b87"/>
    </marker>
  </defs>
  <path d="M284 346 H598" stroke="#176b87" stroke-width="5" marker-end="url(#arrow)" fill="none"/>
  <path d="M439 308 V384" stroke="#176b87" stroke-width="5" marker-end="url(#arrow)" fill="none"/>
  <path d="M536 438 C590 438 582 346 598 346" stroke="#176b87" stroke-width="5" marker-end="url(#arrow)" fill="none"/>
  <path d="M800 346 H862" stroke="#176b87" stroke-width="5" marker-end="url(#arrow)" fill="none"/>
  <path d="M959 394 V458" stroke="#176b87" stroke-width="5" marker-end="url(#arrow)" fill="none"/>
</svg>
