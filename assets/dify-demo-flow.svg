<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Dify DocuMeta 시연 화면 흐름</title>
  <desc id="desc">Dify에서 입력 변수, 지식, 프롬프트, 미리보기를 연결하는 데모 화면</desc>
  <rect width="1280" height="720" fill="#f8fbfd"/>
  <rect x="70" y="58" width="1140" height="604" rx="22" fill="#ffffff" stroke="#d6dee6" stroke-width="2"/>
  <text x="640" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Dify 데모: DocuMeta를 앱 입력으로 연결</text>
  <text x="640" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#687586">조건 카드 → 지식 연결 → 프롬프트 → 미리보기</text>

  <rect x="122" y="204" width="244" height="358" rx="18" fill="#f5f8fb" stroke="#d6dee6"/>
  <text x="150" y="244" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">Start 입력 변수</text>
  <g font-family="Arial, sans-serif" font-size="15" fill="#687586">
    <text x="150" y="296">document_type</text>
    <text x="150" y="340">audience</text>
    <text x="150" y="384">required_slots</text>
    <text x="150" y="428">review_rules</text>
    <text x="150" y="472">source_docs</text>
  </g>
  <g fill="#ffffff" stroke="#d6dee6">
    <rect x="144" y="308" width="176" height="22" rx="5"/>
    <rect x="144" y="352" width="176" height="22" rx="5"/>
    <rect x="144" y="396" width="176" height="22" rx="5"/>
    <rect x="144" y="440" width="176" height="22" rx="5"/>
    <rect x="144" y="484" width="176" height="22" rx="5"/>
  </g>

  <rect x="430" y="204" width="244" height="358" rx="18" fill="#ffffff" stroke="#d6dee6"/>
  <text x="458" y="244" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">Knowledge</text>
  <text x="458" y="285" font-family="Arial, sans-serif" font-size="15" fill="#687586">이전 안내문</text>
  <text x="458" y="327" font-family="Arial, sans-serif" font-size="15" fill="#687586">보안 운영지침</text>
  <text x="458" y="369" font-family="Arial, sans-serif" font-size="15" fill="#687586">작업계획</text>
  <rect x="458" y="420" width="166" height="42" rx="8" fill="#176b87"/>
  <text x="541" y="447" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">근거 검색 연결</text>

  <rect x="738" y="204" width="420" height="358" rx="18" fill="#ffffff" stroke="#d6dee6"/>
  <text x="766" y="244" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">Prompt / Preview</text>
  <rect x="766" y="276" width="344" height="112" rx="10" fill="#f5f8fb" stroke="#d6dee6"/>
  <text x="790" y="310" font-family="Arial, sans-serif" font-size="15" fill="#687586">DocuMeta 조건을 먼저 확인하고</text>
  <text x="790" y="342" font-family="Arial, sans-serif" font-size="15" fill="#687586">빠진 슬롯이 있으면 질문한다.</text>
  <rect x="766" y="426" width="344" height="76" rx="10" fill="#f7f0e3" stroke="#eadfc9"/>
  <text x="790" y="458" font-family="Arial, sans-serif" font-size="15" fill="#594832">초안 출력보다 누락 점검을 먼저 보여준다.</text>

  <path d="M372 382 H420" stroke="#176b87" stroke-width="5" marker-end="url(#arrow)" fill="none"/>
  <path d="M680 382 H728" stroke="#176b87" stroke-width="5" marker-end="url(#arrow)" fill="none"/>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#176b87"/>
    </marker>
  </defs>
</svg>
