<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">오픈소스 구성요소 조합 다이어그램</title>
  <desc id="desc">작성 표면, 문서 모델, 검색과 생성, 검증, 출력 계층이 연결되는 AI 문서 시스템 구성도</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#17324d" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#176b87"/>
    </marker>
  </defs>
  <rect width="1280" height="720" rx="0" fill="#f8fbfd"/>
  <rect x="66" y="58" width="1148" height="604" rx="22" fill="#ffffff" stroke="#d6dee6" stroke-width="2"/>
  <text x="640" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">오픈소스 AI 문서 시스템은 부품 조합이다</text>
  <text x="640" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#687586">화면, 문서 조건, 검색, 생성, 검증, 출력이 한 흐름으로 이어진다</text>

  <g filter="url(#shadow)">
    <rect x="94" y="236" width="182" height="144" rx="16" fill="#ffffff" stroke="#d6dee6"/>
    <circle cx="124" cy="268" r="17" fill="#176b87"/>
    <text x="124" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">1</text>
    <text x="150" y="270" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">작성 표면</text>
    <text x="124" y="314" font-family="Arial, sans-serif" font-size="15" fill="#687586">VS Code 웹뷰</text>
    <text x="124" y="342" font-family="Arial, sans-serif" font-size="15" fill="#687586">Tiptap / Monaco</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="320" y="236" width="182" height="144" rx="16" fill="#ffffff" stroke="#d6dee6"/>
    <circle cx="350" cy="268" r="17" fill="#176b87"/>
    <text x="350" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">2</text>
    <text x="376" y="270" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">문서 조건</text>
    <text x="350" y="314" font-family="Arial, sans-serif" font-size="15" fill="#687586">DocuMeta</text>
    <text x="350" y="342" font-family="Arial, sans-serif" font-size="15" fill="#687586">JSON Schema / DB</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="546" y="236" width="182" height="144" rx="16" fill="#ffffff" stroke="#d6dee6"/>
    <circle cx="576" cy="268" r="17" fill="#176b87"/>
    <text x="576" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">3</text>
    <text x="602" y="270" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">검색/RAG</text>
    <text x="576" y="314" font-family="Arial, sans-serif" font-size="15" fill="#687586">Qdrant / Chroma</text>
    <text x="576" y="342" font-family="Arial, sans-serif" font-size="15" fill="#687586">LanceDB / PostgreSQL</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="772" y="236" width="182" height="144" rx="16" fill="#ffffff" stroke="#d6dee6"/>
    <circle cx="802" cy="268" r="17" fill="#176b87"/>
    <text x="802" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">4</text>
    <text x="828" y="270" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">생성</text>
    <text x="802" y="314" font-family="Arial, sans-serif" font-size="15" fill="#687586">Ollama / vLLM</text>
    <text x="802" y="342" font-family="Arial, sans-serif" font-size="15" fill="#687586">OpenAI 호환 API</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="998" y="236" width="182" height="144" rx="16" fill="#ffffff" stroke="#d6dee6"/>
    <circle cx="1028" cy="268" r="17" fill="#176b87"/>
    <text x="1028" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">5</text>
    <text x="1054" y="270" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">출력</text>
    <text x="1028" y="314" font-family="Arial, sans-serif" font-size="15" fill="#687586">HWPX / PDF / DOCX</text>
    <text x="1028" y="342" font-family="Arial, sans-serif" font-size="15" fill="#687586">Quarto / LibreOffice</text>
  </g>

  <path d="M278 308 H314" stroke="#176b87" stroke-width="4" marker-end="url(#arrow)" fill="none"/>
  <path d="M504 308 H540" stroke="#176b87" stroke-width="4" marker-end="url(#arrow)" fill="none"/>
  <path d="M730 308 H766" stroke="#176b87" stroke-width="4" marker-end="url(#arrow)" fill="none"/>
  <path d="M956 308 H992" stroke="#176b87" stroke-width="4" marker-end="url(#arrow)" fill="none"/>

  <g filter="url(#shadow)">
    <rect x="214" y="466" width="852" height="88" rx="18" fill="#f7f0e3" stroke="#eadfc9"/>
    <text x="248" y="507" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">운영 계층</text>
    <text x="378" y="506" font-family="Arial, sans-serif" font-size="17" fill="#594832">권한 · 감사 로그 · 품질 평가 · 보안 등급 · 배포/연동</text>
    <text x="248" y="536" font-family="Arial, sans-serif" font-size="15" fill="#687586">Dify와 Flowise는 빠른 프로토타입, LangChain/LangGraph/FastAPI는 제품화 제어에 적합하다.</text>
  </g>
</svg>
